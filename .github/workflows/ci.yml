name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22.13 is the floor: node:sqlite with loadExtension, unflagged.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      # Tests needing a built index or the embedding model skip themselves;
      # the rest run against in-memory fixtures and the tracked corpus.
      - run: npm test

  corpus:
    # The tracked corpus must stay loadable, and a full index must build from it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the index from the tracked corpus
        run: npm run index
      - name: Search relevance and smoke test against it
        run: |
          npm run eval
          npm test
          npm run smoke
